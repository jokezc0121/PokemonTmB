<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Pokémon Team Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="pagina-form" id="contenido">
    <div class="caja-form">
      <a href="index.html" class="logo" aria-label="TeamBuilder, volver al inicio"><img src="img/logo.png" alt="" class="logo-img">Team<span>Builder</span></a>
      <h1>Iniciar sesión</h1>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" autocomplete="email" required
                 placeholder="entrenador@correo.com" aria-describedby="error-correo">
          <span class="error" id="error-correo" aria-live="polite"></span>
        </div>

        <div class="campo">
          <label for="clave">Contraseña</label>
          <div class="con-boton">
            <input type="password" id="clave" name="clave" autocomplete="current-password" required
                   aria-describedby="error-clave">
            <button type="button" class="boton-ver" data-ver-clave="clave" aria-pressed="false"
                    aria-label="Mostrar u ocultar contraseña">Mostrar</button>
          </div>
          <span class="error" id="error-clave" aria-live="polite"></span>
        </div>

        <button type="submit" class="boton boton-principal" id="enviar">Iniciar sesión</button>
        <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
      </form>

      <p class="enlace-form">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
      <p class="enlace-form"><a href="index.html">← Volver al inicio</a> · <a href="ayuda.html#cuenta">Ayuda</a></p>
    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/validacion.js"></script>
</body>
</html>
